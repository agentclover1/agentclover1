<!DOCTYPE html>
<html>
<head>
<title>MC Head Viewer</title>
</head>
<body>
<h1>MC Head Viewer</h1>

<input type="text" id="username" placeholder="Minecraft username">
<button onclick="lookup()">Go</button>

<p id="status"></p>
<img id="head" alt="">

<script>
// Each resolver takes a username and returns a UUID (or throws).
const resolvers = [
  async (n) => {
    const r = await fetch("https://api.ashcon.app/mojang/v2/user/" + encodeURIComponent(n));
    if (!r.ok) throw new Error("ashcon " + r.status);
    return (await r.json()).uuid;
  },
  async (n) => {
    const r = await fetch("https://playerdb.co/api/player/minecraft/" + encodeURIComponent(n));
    const d = await r.json();
    if (!d.success) throw new Error("playerdb: not found");
    return d.data.player.id;
  },
  async (n) => {
    const r = await fetch("https://api.minetools.eu/uuid/" + encodeURIComponent(n));
    const d = await r.json();
    if (!d.id) throw new Error("minetools: not found");
    return d.id;
  },
  async (n) => {
    // CORS proxy around Mojang's official API
    const url = "https://api.mojang.com/users/profiles/minecraft/" + encodeURIComponent(n);
    const r = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
    if (!r.ok) throw new Error("mojang proxy " + r.status);
    return (await r.json()).id;
  },
];

async function lookup() {
  const name = document.getElementById("username").value.trim();
  const status = document.getElementById("status");
  const img = document.getElementById("head");
  if (!name) return;

  status.textContent = "Looking up...";
  img.removeAttribute("src");

  const errors = [];
  for (const resolve of resolvers) {
    try {
      const uuid = await resolve(name);
      if (!uuid) throw new Error("no uuid");
      img.onerror = () => { status.textContent = "Got UUID " + uuid + " but the render API failed to load."; };
      img.src = "https://nmsr.nickac.dev/headiso/" + uuid;
      status.textContent = name + " (" + uuid + ")";
      return;
    } catch (e) {
      errors.push(e.message);
    }
  }
  // Lookups blocked (e.g. sandboxed preview): try the username directly, images aren't blocked like fetch is.
  img.onerror = () => { status.textContent = "Lookups failed (" + errors.join(" | ") + ") and the render API didn't accept the username directly."; };
  img.src = "https://nmsr.nickac.dev/headiso/" + encodeURIComponent(name);
  status.textContent = "Lookups failed, trying username directly with the render API...";
}

document.getElementById("username").addEventListener("keydown", function (e) {
  if (e.key === "Enter") lookup();
});
</script>
</body>
</html>
