const BORDER = 20000;

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), info = document.getElementById('info'), tip = document.getElementById('tip');
let W, H, cx = 0, cz = 0, scale = 0.02, hover = -1, mouse = null, moved = 0, msg = '';

function resize() {
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W; cv.height = H;
  scale = Math.min(W, H) / (BORDER * 2 + 2000);
  draw();
}
const sx = x => (x - cx) * scale + W / 2;
const sz = z => (z - cz) * scale + H / 2;

function draw() {
  ctx.fillStyle = '#0e0b16'; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#2a2340'; ctx.lineWidth = 1;

  }

  let t = DATA.length + ' elytra cities';
  if (mouse) {
    const wx = Math.round((mouse[0] - W / 2) / scale + cx), wz = Math.round((mouse[1] - H / 2) / scale + cz);

  }
  if (msg) t += '  |  ' + msg;
  info.textContent = t;

  if (hover >= 0 && mouse && !drag) {
    const p = DATA[hover];
    tip.textContent = 'city  ' + p[0] + ', ' + p[1] + '\nship ~' + p[2] + ', ~' + p[3] + '\nclick to copy';
    tip.style.display = 'block';
    tip.style.left = Math.min(W - tip.offsetWidth - 8, mouse[0] + 14) + 'px';
    tip.style.top = Math.min(H - tip.offsetHeight - 8, mouse[1] + 14) + 'px';
  } else {
    tip.style.display = 'none';
  }
}

let drag = null;
cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = [e.clientX, e.clientY, cx, cz]; moved = 0; };

  const click = drag && moved < 5;
  drag = null;

    const s = DATA[hover][0] + ', ' + DATA[hover][1];
    const done = () => { msg = 'copied ' + s; draw(); };

  msg = '';

    moved = Math.max(moved, Math.abs(e.clientX - drag[0]) + Math.abs(e.clientY - drag[1]));

    cz = drag[3] - (e.clientY - drag[1]) / scale;
  }
  hover = -1;
  let best = 100;
  for (let i = 0; i < DATA.length; i++) {
    const d = (sx(DATA[i][0]) - e.clientX) ** 2 + (sz(DATA[i][1]) - e.clientY) ** 2;
    if (d < best) { best = d; hover = i; }
  }
  draw();
};
cv.onwheel = e => {
  e.preventDefault();
  const wx = (e.clientX - W / 2) / scale + cx, wz = (e.clientY - H / 2) / scale + cz;
  scale = Math.max(0.004, Math.min(4, scale * Math.exp(-e.deltaY * 0.0015)));
  cx = wx - (e.clientX - W / 2) / scale; cz = wz - (e.clientY - H / 2) / scale;
  draw();
};
document.getElementById('export').onclick = () => {
  const rows = DATA.slice().sort((a, b) => Math.hypot(a[0], a[1]) - Math.hypot(b[0], b[1]));
  const text = rows.map(p => p[0] + ', ' + p[1]).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = 'elytra_end_cities.txt';
  a.click();
};
